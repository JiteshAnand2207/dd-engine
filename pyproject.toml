[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-engine"
version = "0.4.0"
description = "Codex-native due-diligence engine foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow==12.2.0",
  "pypdf==6.10.0",
  "python-docx==1.2.0",
  "reportlab==4.4.9",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==8.3.5",
  "ruff==0.9.10",
]

[project.scripts]
dd-engine = "dd_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"scripts/generate_synthetic_room.py" = ["E501"]
"scripts/synthetic_formats.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
