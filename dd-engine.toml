[dd_engine]
schema_version = 1
runs_dir = "runs"
telemetry_enabled = false
external_logging_enabled = false
public_research_enabled = false
require_api_key = false

[register]
max_archive_members = 1000
max_archive_total_uncompressed_bytes = 268435456
max_archive_member_uncompressed_bytes = 67108864

[extraction]
native_first = true
optional_ocr = true
unsupported_policy = "quarantine"
pdf_min_native_characters = 24
render_scale = 2.0

[analysis]
jurisdiction = "IE"
workstreams = ["financial", "commercial", "legal_contractual", "operational_management", "it"]
tax_mode = "standalone"

[reporting]
report_format = "markdown"
ic_brief_format = "pdf"
ic_brief_pages = 2
page_size = "A4"

[model_routing]
deterministic_profile = "deterministic"
mechanical_profile = "economy_mechanical"
judgment_profile = "frontier_judgment"
red_team_profile = "frontier_red_team"
direct_api_enabled = false
